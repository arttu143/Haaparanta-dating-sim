<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="peliStyle.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <dialog id="menu" class="modal">
        <div class="title">
            <h1>Title</h1>
        </div>
        <div class="new game"></div>
            <button type="new">new game</button>
        <div class="load game"></div>
            <button type="load">Load game</button>
        <div class="options">
            <button type="options">Options</button>
        </div>
    </dialog>
    <dialog id="menu" class="modal_manu">
        <div class="title">
            <h1>Title</h1>
        </div>
        <div class="new game"></div>
            <button type="new">new game</button>
        <div class="load game"></div>
            <button type="load">Load game</button>
        <div class="options">
            <button type="options">Options</button>
        </div>
    </dialog>
    <div class="mapContainer">
        <img src="img/map.png" alt="Map" class="mapImg" />
        <button id="invBtn">
            <span>Inventory</span>
        </button>
        <button id="menuBtn">
            <span>Menu</span>
        </button>
        <button id="playerPin"></button>
    </div>
    <dialog id="cityModal" class="modal">
        <div class="modalContent">
        <span></span>
        <img id="modalImg"/>
        </div>
    </dialog>
    <script src="peliScript.js" defer></script>
</body>
</html>
