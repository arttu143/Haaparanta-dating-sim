<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="peliStyle.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<dialog id="menu" class="menuModal">
  <button id="closemenu" class="closeBtn" aria-label="Close">&times;</button>

  <h1 class="title">Title</h1>

  <button type="button" class="button-2 newgame">New Game</button>

  <button type="button" class="button-2 loadgame">Load Game</button>

  <button type="button" class="button-2 options">Options</button>

</dialog>
    <dialog id="settings" class="settingsModal">
        <button id="closeModal" class="closeBtn" aria-label="Close">&times;</button>
        <div class="sound">
            <label for="sound">sound</label>
            <input type="checkbox" id="sound">
        </div>
        <div class="fullscreen">
            <label for="fullscreen">fullscreen</label>
            <input type="checkbox" id="fullscreen">
        </div>
        <div class="palette">
            <p>palette swap</p>
            <select name="palette" id="palettechoose">
                <option value="palette1">Palette1</option>
                <option value="palette2">Palette2</option>
                <option value="palette3">Palette3</option>
            </select>
        </div>
    </dialog>
    
    <div class="mapContainer">
        <img src="img/map2.png" alt="Map" class="mapImg" />
        <button type="button" class="button-2 inv" id="invBtn">
            <span>Inventory</span>
        </button>
        <button type="button" class="button-2 menu" id="menuBtn">
            <span>Menu</span>
        </button>
        <button id="playerPin"></button>
        <dialog id="cityModal" class="modal">
            <div class="modalContent">
            <span></span>
            <img id="modalImg"/>
            </div>
        </dialog>
        <dialog id="inventory" class="invModal">
            <button id="closeinv" class="closeBtn" aria-label="Close">&times;</button>
            <h1>Inventory</h1>
            <div id="invGrid" class="invGrid">
                <div id="slot1"></div>
                <div id="slot2"></div>
                <div id="slot3"></div>
                <div id="slot4"></div>
                <div id="slot5"></div>
                <div id="slot6"></div>
                <div id="slot7"></div>
                <div id="slot8"></div>
                <div id="slot9"></div>
                <div id="slot10"></div>
                <div id="slot11"></div>
                <div id="slot12"></div>
            </div>
        </dialog>
    </div>
    <script src="peliScript.js" defer></script>

    <p><a href="mainmenu.html">temp</a></p>
</body>
</html>
