<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="peliStyle.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <dialog id="menuModal" class="modal">
        <div class="title">
            <h1>Title</h1>
        </div>
        <div class="new game">
            <button type="new">new game</button>
        </div>
        <div class="load game">
            <button type="load">Load game</button>
        </div>
        <div class="options">
            <button type="options">Options</button>
        </div>
    </dialog>

    <dialog id="stingModal" class="modal">
        <div class="fullscreen">
            <input type="checkbox" value="sound">
        </div>
        <div class="load game">
            <button type="checkbox" value="fullscreen">
        </div>
        <div class="palette">
            <select name="palette" id="palettechose">
                <option value="palette1">Palette1</option>
                <option value="palette2">Palette2</option>
                <option value="palette3">Palette3</option>
            </select>
        </div>
    </dialog>
    
    <div class="mapContainer">
        <img src="img/map.png" alt="Map" class="mapImg" />
        <button id="invBtn">
            <span>Inventory</span>
        </button>
        <button id="menuBtn">
            <span>Menu</span>
        </button>
        <button id="playerPin"></button>
        <dialog id="cityModal" class="modal">
            <div class="modalContent">
            <span></span>
            <img id="modalImg"/>
            </div>
        </dialog>
        <div id="inventory" class="invModal" hidden>
            <button id="closeModal" class="closeBtn" aria-label="Close">&times;</button>
            <span></span>
            <img id="invImg"/>
        </div>
    </div>
    <script src="peliScript.js" defer></script>
</body>
</html>
