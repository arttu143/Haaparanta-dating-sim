<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="peliStyle.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <dialog id="menu" class="menuModal">
        <button id="closemenu" class="closeBtn" aria-label="Close">&times;</button>
        <div class="title">
            <h1>Title</h1>
        </div>
        <div class="new game">
            <button type="new">new game</button>
        </div>
        <div class="load game">
            <button type="load">Load game</button>
        </div>
        <div class="options">
            <button type="options">Options</button>
        </div>
    </dialog>

    <dialog id="settings" class="setingsModal">
        <button id="closeModal" class="closeBtn" aria-label="Close">&times;</button>
        <div class="sound">
            <label for="fullscreen">sound</label>
            <input type="checkbox" id="sound">
        </div>
        <div class="fullscreen">
            <label for="fullscreen">fullscreen</label>
            <input type="checkbox" id="fullscreen">
        </div>
        <div class="palette">
            <p>palette swap</p>
            <select name="palette" id="palettechose">
                <option value="palette1">Palette1</option>
                <option value="palette2">Palette2</option>
                <option value="palette3">Palette3</option>
            </select>
        </div>
    </dialog>
    <div class="mapContainer">
        <img src="img/map.png" alt="Map" class="mapImg" />
        <button id="invBtn">
            <span>Inventory</span>
        </button>
        <button id="menuBtn">
            <span>Menu</span>
        </button>
        <button id="playerPin"></button>
        <dialog id="cityModal" class="modal">
            <div class="modalContent">
            <span></span>
            <img id="modalImg"/>
            </div>
        </dialog>
        <dialog id="inventory" class="invModal">
            <button id="closeinv" class="closeBtn" aria-label="Close">&times;</button>
            <h1>Inventory</h1>
            <div id="invGrid" class="invGrid">
                <div id="slot1"></div>
                <div id="slot2"></div>
                <div id="slot3"></div>
                <div id="slot4"></div>
                <div id="slot5"></div>
                <div id="slot6"></div>
                <div id="slot7"></div>
                <div id="slot8"></div>
                <div id="slot9"></div>
                <div id="slot10"></div>
                <div id="slot11"></div>
                <div id="slot12"></div>
            </div>
        </dialog>
    </div>
    <script src="peliScript.js" defer></script>
</body>
</html>
